name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - name: Canonicalize Windows temporary paths
        shell: pwsh
        run: |
          node -e "const fs=require('node:fs'),os=require('node:os');const before=os.tmpdir(),canonical=fs.realpathSync(before);fs.appendFileSync(process.env.GITHUB_ENV,'TEMP='+canonical+'\nTMP='+canonical+'\n');console.log(JSON.stringify({temporaryPathAliasResolved:before.toLowerCase()!==canonical.toLowerCase()}));"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:mcp
      - run: npm run test:computer:mcp
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '9.0.x'
      - run: npm run verify:archive
